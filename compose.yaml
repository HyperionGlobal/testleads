services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: hyperion
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: hyperion
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -U hyperion]
      interval: 5s
      retries: 20
  web:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://hyperion:${POSTGRES_PASSWORD}@db:5432/hyperion
    ports: ["127.0.0.1:3000:3000"]
    depends_on:
      db:
        condition: service_healthy
    command: sh -c 'npm run db:migrate && npm run db:seed && npm start'
    healthcheck:
      test: [CMD, node, -e, "fetch('http://localhost:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      retries: 3
  worker:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://hyperion:${POSTGRES_PASSWORD}@db:5432/hyperion
    command: npm run worker
    depends_on:
      web:
        condition: service_healthy
volumes:
  pgdata:
